name: build

# Throwaway branch: hunt flaky tests by repeating them many times.
on:
  push:

jobs:
  stress:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      STRESS_ITERATIONS: 256
      STRESS_REGEX: ^app_gl_(default|tri_glsl)$
    strategy:
      fail-fast: false
      matrix:
        target: [win32, win64]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        submodules: recursive
    - name: Build and stress
      run: .\ci\build-msvc.ps1 -arch:x86 -target:${{ matrix.target }} -buildRoot:build
